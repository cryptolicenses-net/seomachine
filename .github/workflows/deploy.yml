name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'output/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy dir for secrets
        run: |
          # output/ is served as-is: keep workflow files and wrangler caches out of it
          rm -rf output/.github output/.wrangler
          python3 "$GITHUB_WORKSPACE/.github/secret-gate.py" output
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy output --project-name=cryptolicenses-net --branch=master --commit-dirty=true
